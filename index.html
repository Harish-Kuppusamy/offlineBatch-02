<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html</title>
</head>

<body>

    <!-- Heading tags-->
    <h1 id="harish">Hello</h1>
    <h2 class="asdf">Hello</h2>
    <h3>Hello</h3>


    <!--basic tags & attributes-->
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nostrum, perspiciatis.</p>
    <a href="https://www.flipkart.com/">Click me</a>

    <ul>
        <li> item 1</li>
    </ul>
    <ol>
        <li>item 1</li>
    </ol>


    <!--Forms-->
    <form>
        <input type="text">
        <input type="number" min="0" max="35">
        <select name="selectTag">
            <option value="abc">a</option>
            <option value="">a</option>
            <option value="">a</option>
        </select>
        <input type="range" name="ab" id="qwer">
        <label for="a">Male</label>
        <input type="radio" name="gender" id="a">
        <label for="b">Female</label>
        <input type="radio" name="gender" id="b">
        <button type="button"> submit</button>
    </form>


    <!--Table-->
    <table border="1">
        <caption>ipl score</caption>
        <tr>
            <td>A</td>
            <td>B</td>
            <td rowspan="2">C</td>
        </tr>
        <tr>
            <td>a</td>
            <td>b</td>
        </tr>
    </table>


    <!-- Semantic tags Used for SEO optimization-->
    <nav></nav>
    <section></section>
    <footer></footer>
    <header></header>
    <aside></aside>
    <article></article>
    <main></main>

    <!--division tag-->
    <div>
    </div>


</body>

</html>
